<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[REDACTED] INNOVATIONS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .title {
    font-size: 1rem;
    color: #888;
    letter-spacing: 0.4em;
    text-transform: uppercase;
  }
  input {
    background: #0a0a0a;
    border: 1px solid #555;
    color: #c8c8c8;
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    padding: 10px 16px;
    width: 280px;
    text-align: center;
    outline: none;
  }
  input::placeholder { color: #444; }
  button {
    background: transparent;
    border: 1px solid #555;
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    padding: 8px 24px;
    cursor: pointer;
  }
  button:hover { color: #c8c8c8; border-color: #888; }
</style>
</head>
<body>

<div class="title">[REDACTED] INNOVATIONS</div>

<input type="text" id="codeInput" placeholder="enter code" autocomplete="off" spellcheck="false" />
<button onclick="submitCode()">SUBMIT</button>

<script>
  function submitCode() {
    const code = document.getElementById('codeInput').value.trim();
    if (code) window.location.href = code + '.html';
  }
  document.getElementById('codeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitCode();
  });
</script>

</body>
</html>
